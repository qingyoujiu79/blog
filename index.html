<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一个安静的角落，记录日常、读书和路上看到的东西。">
<meta name="theme-color" content="#f5f7fc">
<title>星屑记事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%237b9bff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f7a8c4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<canvas id="sakura"></canvas>
<header class="nav" id="nav"></header>

<section class="hero" id="hero"></section>

<main class="wrap">
  <div class="layout">
    <div>
      <div id="worksBanner"></div>
      <div class="post-list" id="postList"></div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</main>

<footer class="footer" id="footer"></footer>

<div class="dock">
  <button class="dock-btn" id="toTop" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
  </button>
</div>

<div class="search-mask" id="searchMask">
  <div class="search-box">
    <input class="search-input" id="searchInput" type="text" placeholder="搜索文章…　Ctrl + K" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/sakura.js"></script>
</body>
</html>
