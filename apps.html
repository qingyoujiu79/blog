<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</div>

<main class="wrap" style="max-width:980px;padding-top:0">

<div class="kanban" id="kanban">

<div class="search-mask" id="searchMask">

    <input class="search-input" id="searchInput" type="text" placeholder="搜索文章…　Ctrl + K" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/sakura.js"></script>
